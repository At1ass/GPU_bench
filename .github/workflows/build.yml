name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsdl2-dev libgl-dev build-essential
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y mingw-w64
            curl -L -o sdl2-mingw.tar.gz \
              https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-devel-2.30.12-mingw.tar.gz
            tar xzf sdl2-mingw.tar.gz
            sudo cp -r SDL2-2.30.12/x86_64-w64-mingw32/* /usr/x86_64-w64-mingw32/
            sudo cp -r SDL2-2.30.12/i686-w64-mingw32/* /usr/i686-w64-mingw32/
          fi

      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Build native
        run: ./scripts/build.sh native

      - name: Unit tests
        run: ./build_native/gpubench_tests --no-color

      - name: Build MinGW64
        if: matrix.compiler == 'gcc'
        run: ./scripts/build.sh mingw64

      - name: Build MinGW32
        if: matrix.compiler == 'gcc'
        run: ./scripts/build.sh mingw32

      - name: Upload Linux artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            build_native/gpu_benchmark
            build_native/gpu_demo

      - name: Upload Windows x64 artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build_mingw64/gpu_benchmark.exe
            build_mingw64/gpu_demo.exe
            build_mingw64/*.dll

      - name: Upload Windows x86 artifacts
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: |
            build_mingw32/gpu_benchmark.exe
            build_mingw32/gpu_demo.exe
            build_mingw32/*.dll

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install sdl2 cmake

      - name: Build
        run: ./scripts/build.sh native

      - name: Unit tests
        run: ./build_native/gpubench_tests --no-color

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build_native/gpu_benchmark
            build_native/gpu_demo

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SDL2
        run: |
          curl -L -o sdl2-devel.zip https://github.com/libsdl-org/SDL/releases/download/release-2.30.12/SDL2-devel-2.30.12-VC.zip
          7z x sdl2-devel.zip -osdl2
          echo "SDL2DIR=${{ github.workspace }}\sdl2\SDL2-2.30.12" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSDL2_DIR="$env:SDL2DIR/cmake" -DCMAKE_PREFIX_PATH="$env:SDL2DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: build\Release\gpubench_tests.exe --no-color

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          path: |
            build/Release/gpu_benchmark.exe
            build/Release/gpu_demo.exe

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y cmake sdl2 mesa-libs gmake bash
          run: |
            bash ./scripts/build.sh native
            ./build_native/gpubench_tests --no-color
